[coverage:run]
omit = nzssdt_2023/cli.py

[coverage:report]
exclude_lines =
	pragma: no cover
	def __repr__
	if self.debug:
	if settings.DEBUG
	raise AssertionError
	raise NotImplementedError
	if 0:
	if __name__ == .__main__.:
	def main
	if TYPE_CHECKING


[tox:tox]
isolated_build = true
requires = tox-uv
envlist = audit, py310, py311, py312, format, lint, build-linux, build-macos

[gh-actions]
python =
	3.11: py311, format, lint, build-linux, build-macos
	3.10: py310

[testenv]
allowlist_externals = pytest
dependency_groups = dev
passenv = *
setenv =
	PYTHONPATH = {toxinidir}
	PYTHONWARNINGS = ignore
commands =
	pytest --cov=nzssdt_2023 --cov-branch --cov-report=xml --cov-report=term-missing tests

[testenv:audit]
allowlist_externals =
	uv
dependency_groups = dev
commands =
	uv export --format requirements-txt --no-emit-project -o audit.txt
	uv run pip-audit -r audit.txt
	uv run safety scan

[testenv:format]
allowlist_externals =
	ruff
dependency_groups = dev
commands =
	ruff format nzssdt_2023 tests

[testenv:lint]
allowlist_externals =
	ruff
	mypy
dependency_groups = dev
commands =
	ruff check nzssdt_2023 tests
	mypy nzssdt_2023 tests --explicit-package-bases

[testenv:build-linux]
platform = linux
allowlist_externals =
	uv
	twine
dependency_groups = dev
commands =
	uv build
	twine check dist/*

[testenv:build-macos]
platform = darwin
allowlist_externals =
	uv
	twine
dependency_groups = dev
commands =
	uv build
	twine check dist/*
